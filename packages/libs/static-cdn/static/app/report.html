<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Feedback & Bug Report Form</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #1f2937; }
    .wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.08); padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 20px; color: #4b5563; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px; font: inherit; }
    textarea { min-height: 140px; resize: vertical; }
    button { border: 0; background: #4f46e5; color: #fff; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 14px; font-weight: 600; }
    .ok { color: #047857; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="titleText">Feedback & Bug Report Form</h1>
      <form id="feedbackForm">
        <div class="field" id="appNameField">
          <label id="appNameLabel" for="appName">App name you are using</label>
          <input id="appName" name="appName" type="text" required />
        </div>

        <div class="field">
          <label id="detailLabel" for="detail">Please describe the issue you encountered or share your feedback:</label>
          <textarea id="detail" name="detail" required></textarea>
        </div>

        <div class="field">
          <label id="emailLabel" for="email">Would you like to receive a direct response from us? (If yes, please enter your email)</label>
          <input id="email" name="email" type="email" placeholder="email@domain.com (optional)" />
        </div>

        <button id="submitBtn" type="submit">Submit feedback</button>
        <div id="message" class="msg" aria-live="polite"></div>
      </form>
    </div>
  </div>

    const SUPPORTED_LANGUAGES = new Set(Object.keys(I18N));

    // Mapping entry IDs from the provided Google Form.
    const ENTRY = {
      appName: "entry.1027599674",
      detail: "entry.433439198",
      email: "entry.661841789",
    };

    const form = document.getElementById("feedbackForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const appNameField = document.getElementById("appNameField");
    const titleText = document.getElementById("titleText");
    const appNameLabel = document.getElementById("appNameLabel");
    const detailLabel = document.getElementById("detailLabel");
    const emailLabel = document.getElementById("emailLabel");
    const emailInput = document.getElementById("email");

    const params = new URLSearchParams(window.location.search);
    const appNameFromParam = (params.get("appName") || "").trim();

    const normalizeLang = (rawLang) => {
      if (!rawLang) return "en";
      const normalized = rawLang.toLowerCase();
      if (SUPPORTED_LANGUAGES.has(normalized)) return normalized;

      const baseLang = normalized.split("-")[0];
      if (SUPPORTED_LANGUAGES.has(baseLang)) return baseLang;
      if (baseLang === "zh" && SUPPORTED_LANGUAGES.has("zh-cn")) return "zh-cn";

      return "en";
    };

    const lang = normalizeLang(params.get("lang"));
    document.documentElement.lang = lang;

    const activeDictionary = I18N[lang] || I18N.en;

    const applyTranslations = (dictionary) => {
      document.title = dictionary.title;
      titleText.textContent = dictionary.title;
      appNameLabel.textContent = dictionary.appNameLabel;
      detailLabel.textContent = dictionary.detailLabel;
      emailLabel.textContent = dictionary.emailLabel;
      emailInput.placeholder = dictionary.emailPlaceholder;
      submitBtn.textContent = dictionary.submitButton;
    };

    applyTranslations(activeDictionary);

    if (appNameFromParam) {
      appNameField.style.display = "none";
      form.appName.required = false;
      form.appName.value = appNameFromParam;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "";
      message.className = "msg";
      submitBtn.disabled = true;

      try {
        const fd = new FormData();
        const appName = appNameFromParam || form.appName.value.trim();
        fd.append(ENTRY.appName, appName);
        fd.append(ENTRY.detail, form.detail.value.trim());
        fd.append(ENTRY.email, form.email.value.trim());

        // no-cors is required because Google Forms does not return CORS headers.
        await fetch(FORM_RESPONSE_URL, {
          method: "POST",
          mode: "no-cors",
          body: fd,
        });

        message.textContent = activeDictionary.success;
        message.classList.add("ok");
        form.reset();
      } catch (err) {
        message.textContent = activeDictionary.failed;
        message.classList.add("err");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
